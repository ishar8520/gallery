services:
  nginx:
    container_name: nginx
    build:
      context: './services/nginx'
    networks:
      - gallery-network
    ports:
      - '8000:8080'
    volumes:
      - 'nginx-logs-data:/var/log/nginx'
    depends_on:
      auth-service:
        condition: service_healthy
      gallery-service:
        condition: service_healthy
      link-service:
        condition: service_healthy
      frontend:
        condition: service_started

  frontend:
    container_name: frontend
    build:
      context: ./services/frontend
    networks:
      - gallery-network

  auth-service:
    container_name: auth-service
    build:
      context: ./services/auth
    networks:
      - gallery-network
    environment:
      - POSTGRESQL_USERNAME=$AUTH_POSTGRESQL_USERNAME
      - POSTGRESQL_PASSWORD=$AUTH_POSTGRESQL_PASSWORD
      - POSTGRESQL_DATABASE=$AUTH_POSTGRESQL_DATABASE
      - POSTGRESQL_HOST=auth-postgres
      - POSTGRESQL_PORT=5432
      - REDIS_HOST=auth-redis
      - REDIS_PORT=6379
      - JWT_AUTHJWT_SECRET_KEY=$JWT_SECRET_KEY
      - JWT_ACCESS_EXPIRES_SECONDS=$JWT_ACCESS_EXPIRES_SECONDS
      - JWT_REFRESH_EXPIRES_SECONDS=$JWT_REFRESH_EXPIRES_SECONDS
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONFIRMATION_TOKEN_TTL_SECONDS=${CONFIRMATION_TOKEN_TTL_SECONDS:-86400}
      - AUTH_SUPERUSER_USERNAME=$AUTH_SUPERUSER_USERNAME
      - AUTH_SUPERUSER_PASSWORD=$AUTH_SUPERUSER_PASSWORD
      - AUTH_SUPERUSER_EMAIL=$AUTH_SUPERUSER_EMAIL
    depends_on:
      auth-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/auth/api/v1/_healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  auth-postgres:
    container_name: auth-postgres
    image: postgres:17
    networks:
      - gallery-network
    volumes:
      - 'auth-postgres-data:/var/lib/postgresql/data'
    environment:
      - POSTGRES_USER=$AUTH_POSTGRESQL_USERNAME
      - POSTGRES_PASSWORD=$AUTH_POSTGRESQL_PASSWORD
      - POSTGRES_DB=$AUTH_POSTGRESQL_DATABASE
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$AUTH_POSTGRESQL_USERNAME --dbname=$AUTH_POSTGRESQL_DATABASE"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  auth-redis:
    container_name: auth-redis
    image: redis:8.0
    networks:
      - gallery-network
    volumes:
      - 'auth-redis-data:/data'
    command: [ 'redis-server', '--maxmemory', '${REDIS_MAXMEMORY:-200mb}' ]
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "[[ $(redis-cli ping) == 'PONG' ]] " ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    
  gallery-service:
    container_name: gallery-service
    build:
      context: ./services/gallery
    networks:
      - gallery-network
    environment:
      - PROJECT_TITLE=Gallery Service
      - GALLERY_POSTGRESQL_USERNAME=$GALLERY_POSTGRESQL_USERNAME
      - GALLERY_POSTGRESQL_PASSWORD=$GALLERY_POSTGRESQL_PASSWORD
      - GALLERY_POSTGRESQL_DATABASE=$GALLERY_POSTGRESQL_DATABASE
      - GALLERY_POSTGRESQL_HOST=gallery-postgres
      - GALLERY_POSTGRESQL_PORT=5432
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_USER=$MINIO_USER
      - MINIO_PASSWORD=$MINIO_PASSWORD
      - MINIO_BUCKET=gallery
      - MINIO_PUBLIC_HOST=${MINIO_PUBLIC_HOST:-localhost:8000}
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=8000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      gallery-postgres:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/api/v1/_healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  gallery-postgres:
    container_name: gallery-postgres
    image: postgres:17
    networks:
      - gallery-network
    volumes:
      - 'gallery-postgres-data:/var/lib/postgresql/data'
    environment:
      - POSTGRES_USER=$GALLERY_POSTGRESQL_USERNAME
      - POSTGRES_PASSWORD=$GALLERY_POSTGRESQL_PASSWORD
      - POSTGRES_DB=$GALLERY_POSTGRESQL_DATABASE
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$GALLERY_POSTGRESQL_USERNAME --dbname=$GALLERY_POSTGRESQL_DATABASE"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  minio:
    container_name: gallery-minio
    build:
      context: './services/minio'
    networks:
      - gallery-network
    environment:
      - MINIO_ROOT_USER=$MINIO_USER
      - MINIO_ROOT_PASSWORD=$MINIO_PASSWORD
    volumes:
      - 'minio-data:/data'
    ports:
      - '9000:9000'
      - '9001:9001'

  kafka:
    container_name: kafka
    image: apache/kafka:3.9.0
    networks:
      - gallery-network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  mail-service:
    container_name: mail-service
    build:
      context: ./services/mail
    networks:
      - gallery-network
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_FROM_EMAIL=noreply@gallery.local
      - LINK_SERVICE_URL=http://link-service:8000
      - AUTH_PUBLIC_URL=${AUTH_PUBLIC_URL:-http://localhost:8000}
    depends_on:
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
      link-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/mail/api/v1/_healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  mailhog:
    container_name: mailhog
    image: mailhog/mailhog:latest
    networks:
      - gallery-network
    ports:
      - '1025:1025'
      - '8025:8025'

  link-service:
    container_name: link-service
    build:
      context: ./services/link
    networks:
      - gallery-network
    environment:
      - LINK_REDIS_HOST=link-redis
      - LINK_REDIS_PORT=6379
      - PROJECT_PUBLIC_URL=${AUTH_PUBLIC_URL:-http://localhost:8000}
    depends_on:
      link-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/link/api/v1/_healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  link-redis:
    container_name: link-redis
    image: redis:8.0
    networks:
      - gallery-network
    volumes:
      - 'link-redis-data:/data'
    command: [ 'redis-server', '--maxmemory', '${REDIS_MAXMEMORY:-100mb}' ]
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "[[ $(redis-cli ping) == 'PONG' ]] "]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

networks:
  gallery-network:

volumes:
  nginx-logs-data:
  minio-data:
  auth-postgres-data:
  auth-redis-data:
  gallery-postgres-data:
  kafka-data:
  link-redis-data: