upstream auth-service {
    server auth-service:8000;
}

upstream gallery-service {
    server gallery-service:8000;
}

upstream link-service {
    server link-service:8000;
}

upstream ugc-service {
    server ugc-service:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 8080 default_server;
    server_name _;

    location /auth {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_pass http://auth-service;
    }

    location /api {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_pass http://gallery-service;
    }

    location /link {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_pass http://link-service;
    }

    location /s/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_pass http://link-service;
    }

    location /ugc {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_pass http://ugc-service;
    }

    # Проксирует запросы к MinIO (presigned URLs).
    # Host: minio:9000 обязателен — с ним совпадает подпись presigned URL.
    location /minio/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_pass http://frontend;
    }
}
